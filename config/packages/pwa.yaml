pwa:
    image_processor: 'pwa.image_processor.imagick'
    #image_processor: 'pwa.image_processor.gd'
    #logger: 'App\Service\PwaLogger'
#    user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36'
    #native:
    #    enabled: true
    #    user_agent: 'Google Chrome'
    #    header_name: 'sec-ch-ua'
    favicons:
        enabled: true
        src: "images/pwabundlelogo.svg"
        tile_color: "#FCFCFC"
        use_start_image: true
        use_silhouette: false
        safari_pinned_tab_color: "#FCFCFC"
        low_resolution: true
        monochrome: true
        potrace: "potrace"
    manifest:
        enabled: true
        public_url: '/pwa/site.{locale}.webmanifest'
        background_color: "#FCFCFC"
        theme_color: "#BE202F"
        name: 'app.name'
        short_name: 'app.short_name'
        description: 'app.description'
        orientation: "any"
        display: "standalone"
        scope: "/"
        display_override: ['fullscreen', 'minimal-ui', 'window-controls-overlay']
        id: "symphone"
        start_url: "app_homepage"
        icons:
            - src: "images/pwabundlelogo.svg"
              format: 'png'
              sizes: [48, 96, 128, 144, 192, 256, 384, 512]
              purpose: 'any'
            - src: "images/pwabundlelogo.svg"
              format: 'png'
              sizes: [48, 96, 128, 144, 192, 256, 384, 512]
              image_scale: 50
              background_color: "#c3d7f7"
              purpose: 'maskable'
        screenshots:
            - src: "images/wide.png"
              format: 'png'
              label: "The homepage"
            - src: "images/narrow.png"
              format: 'png'
              label: "The homepage"
        categories:
            - "education"
            - "utilities"
        shortcuts:
            - name: "Working"
              short_name: "Working"
              description: "Open Symphone's working demos"
              url: '/'
              icons:
                  - src: "icons/shortcut-working.svg"
                    sizes: [48, 96, 128, 144, 192, 256, 384, 512]
                    format: 'png'
            - name: "Todo"
              short_name: "Todo"
              description: "Browse Symphone's planned demos"
              url: '/'
              icons:
                  - src: "icons/shortcut-todo.svg"
                    sizes: [48, 96, 128, 144, 192, 256, 384, 512]
                    format: 'png'
            - name: "Info"
              short_name: "Info"
              description: "Open information about Symphone"
              url: '/'
              icons:
                  - src: "icons/shortcut-info.svg"
                    sizes: [48, 96, 128, 144, 192, 256, 384, 512]
                    format: 'png'
            - name: "Share"
              short_name: "Share"
              description: "Share Symphone"
              url: '/'
              icons:
                  - src: "icons/shortcut-share.svg"
                    sizes: [48, 96, 128, 144, 192, 256, 384, 512]
                    format: 'png'
        edge_side_panel:
            preferred_width: 280
        widgets: []
        related_applications: []
        protocol_handlers:
            - protocol: "web+symphone"
              placeholder: 'type'
              url:
                  path: "app_protocol_handler"
        file_handlers:
            - action: '/'
              accept:
                  'image/png': ['.png']
                  'image/jpeg': ['.jpg', '.jpeg']
                  'image/webp': ['.webp']
                  'image/gif': ['.gif']
        share_target:
            action:
                path: 'app_share_target_receive'
            method: 'POST'
            enctype: 'multipart/form-data'
            params:
                files:
                    - name: 'image'
                      accept: ['image/jpeg', 'image/png', 'image/webp', 'image/gif']

    serviceworker:
        enabled: true
        src: "sw.js"
        skip_waiting: true
        workbox:
            enabled: true
            background_sync:
                - queue_name: 'symphone-message-outbox'
                  match_callback: 'route: app_background_sync_message'
                  method: 'POST'
                  broadcast_channel: 'symphone-background-sync'
                  max_retention_time: 1440
            resource_caches:
                - match_callback: 'startsWith: /en_US/partials/'
                  cache_name: 'framework7_partials_en'
                  strategy: 'NetworkFirst'
                  network_timeout: 2
                  preload_urls:
                      - '@framework7_partials_en'
                - match_callback: 'startsWith: /fr_FR/partials/'
                  cache_name: 'framework7_partials_fr'
                  strategy: 'NetworkFirst'
                  network_timeout: 2
                  preload_urls:
                      - '@framework7_partials_fr'
                - match_callback: 'navigate-or-localized-page'
                  cache_name: 'pages'
                  strategy: 'NetworkFirst'
                  network_timeout: 2
                  preload_urls:
                      - '@pages'
            background_fetch:
                enabled: true
                db_name: 'symphone-downloads'
                success_message: '{title} is ready for offline use.'
                failure_message: '{title} could not be downloaded.'
